<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLOOD FINDER</title>
  <meta name="description" content="BLOOD FINDER, an emergency blood donor finder for Bangladesh: find the nearest eligible donor, send a donation proposal, arrange transport and record payment.">
  <meta name="theme-color" content="#8b1a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blood Finder">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="drop" aria-hidden="true"></span>
      <div>
        <strong>BLOOD FINDER</strong>
        <small>Emergency donor matching, Bangladesh</small>
      </div>
    </div>
    <button class="install-btn" id="installBtn" hidden>Install app</button>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">Menu</button>
  </header>

  <nav class="sidenav" id="sidenav">
    <a href="#dashboard" data-view="dashboard">Dashboard</a>
    <p class="navgroup">Find blood</p>
    <a href="#find" data-view="find">Find nearest donor</a>
    <a href="#requests" data-view="requests">Blood requests</a>
    <p class="navgroup">Donation</p>
    <a href="#proposals" data-view="proposals">Proposals and pickup</a>
    <a href="#transport" data-view="transport">Transportation</a>
    <a href="#payments" data-view="payments">Payments</a>
    <a href="#vehicles" data-view="vehicles">Registered vehicles</a>
    <p class="navgroup">Records</p>
    <a href="#donors" data-view="donors">Donors</a>
    <a href="#medical" data-view="medical">Medical status</a>
    <a href="#seekers" data-view="seekers">Blood seekers</a>
    <a href="#hospitals" data-view="hospitals">Hospitals</a>
    <a href="#tables" data-view="tables">Database tables</a>
    <p class="navgroup">App</p>
    <a href="#install" data-view="install">Install on phone</a>
  </nav>

  <main id="app" tabindex="-1"></main>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button type="button" class="icon-btn" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-foot">
        <button type="button" class="btn ghost" id="modalCancel">Cancel</button>
        <button type="submit" class="btn primary" id="modalOk">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/geo.js"></script>
  <script src="js/hospitals.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
